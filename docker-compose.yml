services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-network

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-network

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    container_name: llm-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - MIGRATIONS_DIR=/app/migrations
    networks:
      - llm-network
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    container_name: llm-api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      debate-orchestrator:
        condition: service_started
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - DEBATE_ORCHESTRATOR_ANALYTICS_URL=http://debate-orchestrator:8082/api/v1/generate
      - DEBATE_ORCHESTRATOR_SIMPLE_URL=http://debate-orchestrator:8082/api/v1/simple
      - QUERY_RATE_LIMIT_REQUESTS=${QUERY_RATE_LIMIT_REQUESTS:-20}
      - QUERY_RATE_LIMIT_WINDOW_SECONDS=${QUERY_RATE_LIMIT_WINDOW_SECONDS:-60}
      - ENVIRONMENT=${ENVIRONMENT}
    networks:
      - llm-network
    restart: unless-stopped

  debate-orchestrator:
    build:
      context: ./debate-orchestrator
      dockerfile: Dockerfile
    container_name: llm-debate-orchestrator
    ports:
      - "${DEBATE_ORCHESTRATOR_PORT:-8082}:8082"
    environment:
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - DEBATER_A_MODEL=${DEBATER_A_MODEL:-yandexgpt-lite}
      - DEBATER_B_MODEL=${DEBATER_B_MODEL:-deepseek-v3}
      - DEBATER_C_MODEL=${DEBATER_C_MODEL:-yandexgpt-lite}
      - JUDGE_MODEL=${JUDGE_MODEL:-yandexgpt}
      - DEBATER_MAX_TOKENS=${DEBATER_MAX_TOKENS:-1024}
      - JUDGE_MAX_TOKENS=${JUDGE_MAX_TOKENS:-2048}
      - SIMPLE_MODEL=${SIMPLE_MODEL:-yandexgpt-lite}
      - SIMPLE_MAX_TOKENS=${SIMPLE_MAX_TOKENS:-1000}
      - DEBUG_BACKEND=${DEBUG_BACKEND:-false}
      - ENVIRONMENT=${ENVIRONMENT}
    networks:
      - llm-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: cmd/telegram-bot/Dockerfile
    container_name: llm-telegram-bot
    depends_on:
      - api-gateway
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_GATEWAY_URL=${TELEGRAM_API_GATEWAY_URL}
      - ENVIRONMENT=${ENVIRONMENT}
    networks:
      - llm-network
    restart: unless-stopped

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
