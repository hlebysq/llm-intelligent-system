name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  YC_REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  debate-orchestrator-tests:
    name: Debate orchestrator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: debate-orchestrator/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - test
      - debate-orchestrator-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/llm-api-gateway:${{ env.IMAGE_TAG }}
            ${{ env.YC_REGISTRY }}/llm-api-gateway:latest

      - name: Build and push telegram-bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/telegram-bot/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/llm-telegram-bot:${{ env.IMAGE_TAG }}
            ${{ env.YC_REGISTRY }}/llm-telegram-bot:latest

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/migrate/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/llm-migrate:${{ env.IMAGE_TAG }}
            ${{ env.YC_REGISTRY }}/llm-migrate:latest

      - name: Build and push debate-orchestrator
        uses: docker/build-push-action@v6
        with:
          context: ./debate-orchestrator
          file: debate-orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/llm-debate-orchestrator:${{ env.IMAGE_TAG }}
            ${{ env.YC_REGISTRY }}/llm-debate-orchestrator:latest

  deploy:
    name: Deploy to Yandex Cloud VM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.YC_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.YC_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        run: |
          mkdir -p .deploy
          cp deployments/docker-compose.prod.yml .deploy/docker-compose.prod.yml
          printf '%s\n' "${{ secrets.PROD_ENV_FILE }}" > .deploy/.env
          printf '\nYC_REGISTRY_ID=%s\nIMAGE_TAG=%s\n' "${{ secrets.YC_REGISTRY_ID }}" "${{ env.IMAGE_TAG }}" >> .deploy/.env

      - name: Copy deployment files
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}" "mkdir -p ${{ secrets.YC_VM_APP_DIR }}"
          scp -i ~/.ssh/deploy_key .deploy/docker-compose.prod.yml .deploy/.env "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:${{ secrets.YC_VM_APP_DIR }}/"

      - name: Run deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}" << 'EOF'
          set -e
          cd "${{ secrets.YC_VM_APP_DIR }}"
          echo "${{ secrets.YC_CR_OAUTH_TOKEN }}" | docker login --username oauth --password-stdin cr.yandex
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up --no-deps migrate
          docker compose -f docker-compose.prod.yml up -d --remove-orphans postgres redis debate-orchestrator api-gateway telegram-bot
          docker image prune -f
          EOF
