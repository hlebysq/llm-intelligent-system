services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - llm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - llm-network
    restart: unless-stopped

  migrate:
    image: cr.yandex/${YC_REGISTRY_ID}/llm-migrate:${IMAGE_TAG:-latest}
    container_name: llm-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      MIGRATIONS_DIR: /app/migrations
    networks:
      - llm-network
    restart: "no"

  debate-orchestrator:
    image: cr.yandex/${YC_REGISTRY_ID}/llm-debate-orchestrator:${IMAGE_TAG:-latest}
    container_name: llm-debate-orchestrator
    environment:
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      DEBATER_A_MODEL: ${DEBATER_A_MODEL}
      DEBATER_B_MODEL: ${DEBATER_B_MODEL}
      DEBATER_C_MODEL: ${DEBATER_C_MODEL}
      JUDGE_MODEL: ${JUDGE_MODEL}
      SIMPLE_MODEL: ${SIMPLE_MODEL}
      DEBATER_MAX_TOKENS: ${DEBATER_MAX_TOKENS:-1024}
      JUDGE_MAX_TOKENS: ${JUDGE_MAX_TOKENS:-2048}
      SIMPLE_MAX_TOKENS: ${SIMPLE_MAX_TOKENS:-1000}
      DEBATE_TIMEOUT_SECONDS: ${DEBATE_TIMEOUT_SECONDS:-300}
      DEBUG_BACKEND: ${DEBUG_BACKEND:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - llm-network
    restart: unless-stopped

  api-gateway:
    image: cr.yandex/${YC_REGISTRY_ID}/llm-api-gateway:${IMAGE_TAG:-latest}
    container_name: llm-api-gateway
    ports:
      - "${API_GATEWAY_PUBLIC_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      debate-orchestrator:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      DEBATE_ORCHESTRATOR_ANALYTICS_URL: http://debate-orchestrator:8082/api/v1/generate
      DEBATE_ORCHESTRATOR_SIMPLE_URL: http://debate-orchestrator:8082/api/v1/simple
      ANALYTICS_DAILY_LIMIT: ${ANALYTICS_DAILY_LIMIT:-5}
      SIMPLE_DAILY_LIMIT: ${SIMPLE_DAILY_LIMIT:-20}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - llm-network
    restart: unless-stopped

  telegram-bot:
    image: cr.yandex/${YC_REGISTRY_ID}/llm-telegram-bot:${IMAGE_TAG:-latest}
    container_name: llm-telegram-bot
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_GATEWAY_URL: http://api-gateway:8080
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - llm-network
    restart: unless-stopped

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
